<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Homeboard · Widescreen TV preview</title><meta name="description" content="Preview Homeboard on a true 16:9 television canvas."><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c1612;color:#b7c6bb;font:12px system-ui,sans-serif}header{height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border-bottom:1px solid #ffffff12}header span{font-size:11px;color:#849a8b}select{font:inherit;background:#1c2c23;border:1px solid #ffffff20;color:#deebdf;border-radius:6px;padding:5px 8px}select:focus-visible{outline:2px solid #c7e7a5}main{position:relative;width:100%;height:calc(100% - 42px);overflow:hidden}iframe{position:absolute;border:0;transform-origin:top left;background:#111e1a} @media(max-width:500px){header span{display:none}header{font-size:11px;padding:0 10px}}
</style></head><body><header><div>Homeboard <span>· Sample data · Actions are simulated</span></div><select aria-label="Preview layout"><option value="1080">1920 × 1080 · TV</option><option value="720">1280 × 720 · TV</option><option value="responsive">Responsive / phone</option></select></header><main><iframe title="Homeboard dashboard preview" src="./dashboard.html"></iframe></main><script type="module">
const frame=document.querySelector('iframe'), stage=document.querySelector('main'), select=document.querySelector('select');
function fit(){const width=stage.clientWidth,height=stage.clientHeight; const layout=select.value; const w=layout==='responsive'?width:layout==='720'?1280:1920,h=layout==='responsive'?height:layout==='720'?720:1080; const scale=Math.min(width/w,height/h); Object.assign(frame.style,{width:`${w}px`,height:`${h}px`,transform:`scale(${scale})`,left:`${(width-w*scale)/2}px`,top:`${(height-h*scale)/2}px`});}
new ResizeObserver(fit).observe(stage);select.addEventListener('change',fit);fit();
</script></body></html>
