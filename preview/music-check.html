<!doctype html><html lang="en"><meta charset="utf-8"><title>Homeboard music checks</title><style>body{font:14px system-ui;background:#17283e;color:white}pre{white-space:pre-wrap}iframe{border:0;position:absolute;left:0;top:220px;transform:scale(.2);transform-origin:top left}</style><h1>Music shortcuts and layout checks</h1><pre id="result">Running…</pre><iframe title="Sample dashboard" src="./dashboard.html"></iframe><script type="module">
const result=document.querySelector('#result'),frame=document.querySelector('iframe'),passed=[];
const assert=(ok,message)=>{if(!ok)throw Error(message);};
const settle=()=>new Promise(r=>setTimeout(r,100));
try {
 await new Promise(r=>frame.addEventListener('load',r,{once:true}));await settle();
 const card=frame.contentDocument.querySelector('homeboard-tv-card'),root=card.shadowRoot;
 assert(root.querySelector('.now-playing'),'Native player missing');
 assert(!root.querySelector('[data-action="music-open"]'),'Default preview should not need a URL');
 const home=root.querySelector('[data-action="home"]');
 assert(home && !home.disabled,'Google TV Home missing');
 assert(card.remoteControls().includes(home),'Home missing from remote navigation');
 home.click();await settle();
 assert(root.querySelector('.notice').textContent.includes('simulated'),'Home action not simulated');
 assert(card._hass.states['switch.living_room_auto_dashboard'].attributes.status==='dashboard exit pause','Exit pause not simulated');
 card._notice='';card.render();
 passed.push('PASS · Google TV Home and exit pause are simulated');
 const nativeConfig=card._config;
 card.setConfig({...nativeConfig,music_assistant:{...nativeConfig.music_assistant,url:'https://music.example/#/home',playlists:nativeConfig.music_assistant.playlists.map(item=>({...item,url:'https://music.example/#/playlists'}))}});
 assert(root.querySelectorAll('.music-playlist').length===3,'Sample playlists missing');
 assert(root.querySelector('.music-destination').textContent.includes('Living room speakers'),'Playback destination missing');
 for(const action of ['music-play','music-open','music-playlist']) {
  root.querySelector(`[data-action="${action}"]`).click();await settle();
  assert(root.querySelector('.notice').textContent.includes('simulated'),'Demo action not simulated');
 }
 assert(root.querySelector('.music-track-title').textContent==='Evening light','Track missing');
 root.querySelector('[data-action="music-control"][data-index="toggle"]').click();await settle();
 assert(root.querySelector('.music-state').textContent==='Paused','Pause state did not update');
 root.querySelector('[data-action="music-control"][data-index="toggle"]').click();await settle();
 assert(root.querySelector('.music-state').textContent==='Playing','Resume state did not update');
 card._notice='';card.render();
 passed.push('PASS · sample playlists, destination and simulated play/open actions');
 const config=card._config;
 card.setConfig({...config,tvs:[{...config.tvs[0],music_assistant_url:'https://music.example/#/home'}]});
 assert(root.querySelector('[data-action="music-tv"]'),'Open on TV missing');
 root.querySelector('[data-action="music-tv"]').click();await settle();
 assert(root.querySelector('.notice').textContent.includes('simulated'),'TV browser launch not simulated');card._notice='';card.render();
 for(const [width,height] of [[1920,1080],[1280,720],[960,540],[390,844]]) {
  frame.style.width=width+'px';frame.style.height=height+'px';await settle();card.fitTV();
  const shell=root.querySelector('.shell').getBoundingClientRect();
  assert(shell.right<=width+2,`Horizontal overflow at ${width}`);
  if(width>=740) assert(shell.bottom<=height+2,`Vertical overflow at ${width}`);
  assert(card.remoteControls().includes(root.querySelector('[data-action="music-play"]')),'Play unavailable to remote navigation');
  passed.push(`PASS · music layout and remote controls at ${width} × ${height}`);
 }
 card.setConfig({...config,music_assistant:{player_entity:'media_player.demo_music'}});
 assert(root.querySelector('.now-playing'),'Entity-only configuration missing player');
 assert(!root.querySelector('[data-action="music-open"]'),'Entity-only configuration has URL shortcut');
 assert(!root.querySelector('iframe'),'Player must use HA entities without iframe');
 const original=card._hass;
 card.hass={...original,states:{...original.states,'media_player.demo_music':{state:'paused',attributes:{supported_features:17469,media_title:'Changed from phone',media_artist:'Other artist'}}}};
 assert(root.querySelector('.music-track-title').textContent==='Changed from phone','External metadata update not rendered');
 assert(root.querySelector('.music-state').textContent==='Paused','External pause state missing');
 card.hass={...original,states:{...original.states,'media_player.demo_music':{state:'unavailable',attributes:{media_title:'Stale title'}}}};
 assert(root.querySelector('.music-track-title').textContent==='Player unavailable','Unavailable state missing');
 assert(!root.querySelector('[data-action="music-control"]'),'Unavailable player controls still present');
 passed.push('PASS · native entity-only player, external updates and unavailable state');
 const editor=frame.contentDocument.createElement('homeboard-tv-editor');
 editor.setConfig(nativeConfig);editor.hass=original;
 const picker=editor.shadowRoot.querySelector('[data-music-form]');
 assert(picker.schema[0].selector.entity.filter.integration==='music_assistant','Picker not filtered to integration');
 picker.dispatchEvent(new frame.contentWindow.CustomEvent('value-changed',{detail:{value:{player_entity:'media_player.another_ma_player'}}}));
 assert(editor._config.music_assistant.player_entity==='media_player.another_ma_player','Picker did not save selected player');
 assert(editor._config.music_assistant.playlists.length===3,'Picker discarded playlist shortcuts');
 assert(!editor._config.music_assistant.url,'Picker introduced a URL requirement');
 passed.push('PASS · native integration player picker preserves entity-only config and playlists');
 card.setConfig({...config,tvs:[{...config.tvs[0],launch_apps:false}]});
 assert(root.querySelector('[data-action="home"]').disabled,'Home must be disabled on unsupported TV');
 card.setConfig({...config,tvs:[]});
 assert(root.querySelector('[data-action="home"]').disabled,'Home must be disabled without target TV');
 passed.push('PASS · Home disabled without a supported target TV');
 // Exercise library loading with a mocked HA connection; never contact a real player.
 card.setConfig({...config,music_assistant:{player_entity:'media_player.demo_music',max_playlists:1}});
 const demoHass=card._hass;card.demoMode=false;
 const requests=[];
 card._hass={...demoHass,callWS:async message=>{
  requests.push(message);
  if(message.type==='config/entity_registry/get') return {config_entry_id:'sample-ma'};
  return {response:{items:[{name:'Favorite evening',uri:'library://playlist/favorite',image:'/preview/sample-album.svg'},{name:'Favorite morning',uri:'library://playlist/morning'}]}};
 }};
 await card.refreshMusicFavorites(true);
 assert(requests[1].service_data.favorite===true,'Favorites filter missing');
 assert(root.querySelectorAll('.music-playlist').length===1,'Favorite limit not applied');
 assert(root.querySelector('.music-name').textContent==='Favorite evening','Favorite name missing');
 assert(root.querySelector('.playlist-art img'),'Favorite artwork missing');
 assert(root.querySelector('.playlist-art img').getAttribute('src')==='/preview/sample-album.svg','Favorite image URL missing');
 assert(root.querySelector('.music-favorites-status').textContent.includes('2 favorite playlists'),'Favorite count missing');
 card.setConfig({...card._config,music_assistant:{...card._config.music_assistant,max_playlists:0}});
 assert(root.querySelectorAll('.music-playlist').length===2,'Show all favorites failed');
 assert(root.querySelectorAll('.playlist-art').length===2,'Fallback music icon missing');
 assert(picker.schema.some(field=>field.name==='show_favorites'),'Favorites toggle missing');
 assert(picker.schema.some(field=>field.name==='max_playlists'),'Favorites limit editor missing');
 card.demoMode=true;card._hass=demoHass;
 passed.push('PASS · fetched favorite names, artwork, fallback icons, display limit and editor options');
 card.setConfig({...config,music_assistant:null});assert(!root.querySelector('.music'),'Optional box not hidden');
 passed.push('PASS · optional music box hides without configuration');
 result.textContent=passed.join('\n')+'\nAll checks passed. Sample data only.';
} catch(error){result.textContent=passed.join('\n')+'\nFAIL · '+error.message;}
</script></html>
