title: Homeboard
views:
  - title: Home
    path: overview
    # Keep a standard view for HA Cast compatibility (no panel: true).
    # Full-width card is available on responsive sections dashboards.
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:homeboard-tv-card
            grid_options:
              columns: full
            tv_mode: true
            theme: aurora
            edge_to_edge: true
            keyboard_navigation: true
            title: A little more at home.
            home_name: Our home
            weather_location: Home
            time_zone: Europe/Stockholm
            locale: en-GB
            # Every entity below is an EXAMPLE: replace it in the card editor.
            price_entity: sensor.electricity_price
            price_attribute: raw_today
            price_start_key: start
            price_end_key: end
            price_value_key: value
            price_factor: 1
            current_price_factor: 1
            price_offset: 0
            price_unit: SEK/kWh
            power_entity: sensor.home_power
            # Any calendar already connected to Home Assistant (e.g. remote/ICS).
            calendar_entity: calendar.family
            calendar_days: 7
            calendar_max_events: 3
            temperature_unit: °C
            home_sensor_entities:
              - sensor.living_room_temperature
              - sensor.bedroom_temperature
              - sensor.kitchen_temperature
              - sensor.indoor_humidity
              - binary_sensor.kitchen_window
              - lock.front_door
              - lock.back_door
            weather_entity: weather.home
            forecast_type: daily
            scenes:
              - entity: scene.evening
                name: Evening
                icon: sun
                # Optional helper reflecting actual scene target states.
                active_entity: binary_sensor.evening_scene_active
              - entity: scene.movie
                name: Movie night
                icon: tv
              - entity: scene.bright
                name: Bright & focused
                icon: bolt
              - entity: scene.goodnight
                name: Good night
                icon: moon
            tvs:
              - name: Living room · Google TV
                # Copy from the auto-dashboard switch's entry_id attribute.
                entry_id: REPLACE_WITH_GOOGLE_TV_CONFIG_ENTRY_ID
                auto_entity: switch.living_room_auto_dashboard
                launch_apps: true
                # Optional full URL, routed to a signed-in TV browser such as TV Bro.
                # music_assistant_url: https://music.example/#/home?player=Livingroom
              - name: Bedroom · LG TV
                entry_id: REPLACE_WITH_LG_CONFIG_ENTRY_ID
                auto_entity: switch.bedroom_auto_dashboard
                # Enable only if this entry has a Google/Android TV remote.
                launch_apps: false
            # Optional. Omit this section to hide the music box.
            # Select the MA player in the visual editor, or set its entity here.
            # No URL is needed for the embedded player or playlist playback.
            music_assistant:
              # url: https://music.example/#/home?player=Livingroom
              player_entity: media_player.music_assistant_living_room
              playlists:
                - name: Evening favourites
                  media_id: library://playlist/REPLACE_WITH_PLAYLIST_ID
                  # Optional: copy the playlist page URL from your MA browser.
                  # url: https://music.example/REPLACE_WITH_PLAYLIST_PAGE
            apps:
              - name: Netflix
                activity: netflix://
                color: '#e50914'
              - name: SVT Play
                # Verify link routing on your TV; override with a package ID if needed.
                activity: https://www.svtplay.se
                color: '#54cf87'
              - name: TV4 Play
                activity: https://www.tv4play.se
                color: '#ed3a45'
