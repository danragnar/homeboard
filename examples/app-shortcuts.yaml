# Card fragment. Configure each screen's app launch method in the integration.
# No card platform setting or target type is needed for these shared shortcuts.
tvs:
  - name: Living room
    entry_id: REPLACE_WITH_HOMEBOARD_ENTRY_ID
    auto_entity: switch.living_room_auto_dashboard
    launch_apps: true
    # Optional: apps here replaces the global shortcut list for this TV.
    # Use it when one TV needs a different launch_id override.
apps:
  - name: Netflix
    app: netflix
    color: '#e50914'
  - name: SVT Play
    app: svt_play
    color: '#54cf87'
  - name: TV4 Play
    app: tv4_play
    color: '#ed3a45'
  - name: YouTube
    app: youtube
    color: '#ed3a45'
  - name: Tänd brasa
    app: svt_play
    # Optional override; an HTTP(S) launch_id opens the browser on LG webOS.
    launch_id: https://www.svtplay.se/video/KXvMGAZ/brasa/endast-sprakande-brasa?video=visa
    color: '#e8743b'
    icon: fire
# A custom shortcut needs name and launch_id, with no app field:
# - name: Custom
#   launch_id: REPLACE_WITH_URL_OR_APP_ID_FOR_YOUR_TV
#   icon: tv
#   color: '#54cf87'
