show_dashboard:
  name: Show dashboard
  description: Show the configured dashboard if the selected screen is safely idle.
  fields:
    entry_id:
      name: Screen configuration
      required: true
      selector:
        config_entry:
          integration: homeboard_tv
launch_app:
  name: Launch app or media
  description: Pause automatic dashboard opening, then launch an Android activity, webOS app/media, browser URL, or HA script. Provide exactly one of activity or target.
  fields:
    entry_id:
      name: Screen configuration
      required: true
      selector:
        config_entry:
          integration: homeboard_tv
    activity:
      name: Legacy Android activity or browser URL
      example: "netflix://"
      selector:
        text:
    target:
      name: App or media target
      description: "An object with type: activity, app, url, or script. webOS app fields: app_id, optional content_id and params. URL field: url. Script fields: entity_id and optional variables."
      selector:
        object:
return_home:
  name: Return to TV Home
  description: Send HOME through the configured TV control method, or launch the configured webOS home app. Pause automatic dashboard reopening for the app-grace period (10 minutes by default).
  fields:
    entry_id:
      name: Screen configuration
      required: true
      selector:
        config_entry:
          integration: homeboard_tv
