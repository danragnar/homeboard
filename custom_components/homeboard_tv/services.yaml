show_dashboard:
  name: Show dashboard
  description: Show the configured dashboard if the selected screen is safely idle.
  fields:
    entry_id:
      name: Screen configuration
      required: true
      selector:
        config_entry:
          integration: homeboard_tv
launch_app:
  name: Launch app or media
  description: Open an app on the selected screen using its configured platform. Choose app and optionally override launch_id, or supply launch_id alone for a custom shortcut. Legacy activity and target calls remain supported.
  fields:
    entry_id:
      name: Screen configuration
      required: true
      selector:
        config_entry:
          integration: homeboard_tv
    app:
      name: App
      description: Built-in app name. The screen configuration selects Android TV Remote or LG webOS automatically.
      example: netflix
      selector:
        select:
          options:
            - netflix
            - youtube
            - svt_play
            - tv4_play
    launch_id:
      name: Launch URL or app ID override
      description: Optional override. Android receives the value as its activity. LG opens HTTP(S) URLs in its browser and launches other values as webOS app IDs.
      selector:
        text:
    activity:
      name: Legacy Android activity or browser URL
      example: "netflix://"
      selector:
        text:
    target:
      name: Legacy advanced target
      description: "An object with type: activity, source, app, url, or script. Source targets need the exact source name from the LG TV source_list. webOS app fields: app_id, optional content_id and params. URL field: url. Script fields: entity_id and optional variables."
      selector:
        object:
return_home:
  name: Return to TV Home
  description: Send HOME through the configured TV control method, or launch the configured webOS home app. Pause automatic dashboard reopening for the app-grace period (10 minutes by default).
  fields:
    entry_id:
      name: Screen configuration
      required: true
      selector:
        config_entry:
          integration: homeboard_tv
